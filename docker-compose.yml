services:
  # Makes YouTube treat the server like a real browser (avoids "confirm you're not a bot").
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    restart: unless-stopped

  api:
    image: ghcr.io/rusilkoirala/musica-api:latest
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      MUSICA_PASSWORD: ${MUSICA_PASSWORD:-}
      MUSICA_DEMO: ${MUSICA_DEMO:-0}
      MUSICA_DEMO_LIMIT: ${MUSICA_DEMO_LIMIT:-5}
      MUSICA_POT_URL: http://pot:4416
    depends_on:
      - pot
    volumes:
      - ${MUSIC_DIR:-./music}:/music
      - ${DATA_DIR:-./data}:/data

  web:
    image: ghcr.io/rusilkoirala/musica-web:latest
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
